# Cluster principal do laboratório.
#
#   3 nós control-plane: cada um roda kube-apiserver, etcd, kube-scheduler e
#                        kube-controller-manager como static pods. O etcd forma
#                        um grupo Raft de 3 membros (tolera a perda de 1).
#   3 nós worker:        onde a aplicação roda.
#
# Cada "nó" é um contêiner Docker. Na frente dos 3 kube-apiservers o kind cria um
# HAProxy (contêiner k8slab-external-load-balancer), que é o endereço usado pelo
# kubectl.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8slab
nodes:
  - role: control-plane
    # A aplicação é publicada como NodePort 30080. Este mapeamento a expõe em
    # http://localhost:8080 no seu computador. Por isso este nó é a "porta de
    # entrada" do laboratório e não é derrubado nos experimentos (em produção
    # esse papel é de um balanceador de carga externo apontando para todos os nós).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
  - role: control-plane
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
