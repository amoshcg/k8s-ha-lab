# O Service dá um endereço estável para um conjunto de pods que muda o tempo
# todo. O EndpointSlice controller mantém a lista de pods PRONTOS (readiness ok)
# e o kube-proxy de cada nó programa essa lista nas regras de rede do nó.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080   # aberta em todos os nós; o kind mapeia a do 1º control plane para localhost:8080
