# Um pod comum, usado para ver o que acontece quando não há scheduler ativo.
apiVersion: v1
kind: Pod
metadata:
  name: simples
  namespace: demo
  labels:
    demo: scheduler
spec:
  containers:
    - name: app
      image: k8slab/web:v1
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
