# spec.nodeName já preenchido: o scheduler ignora este pod e o kubelet do nó o
# executa direto. Escalonar é só isso: escrever spec.nodeName (via Binding).
apiVersion: v1
kind: Pod
metadata:
  name: sem-scheduler
  namespace: demo
  labels:
    demo: scheduler
spec:
  nodeName: k8slab-worker2
  containers:
    - name: app
      image: k8slab/web:v1
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
