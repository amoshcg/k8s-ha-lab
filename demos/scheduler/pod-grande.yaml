# Pede 64 CPUs: nenhum nó tem isso alocável. O filtro NodeResourcesFit elimina
# os workers e o filtro TaintToleration elimina os control planes => Pending.
apiVersion: v1
kind: Pod
metadata:
  name: grande
  namespace: demo
  labels:
    demo: scheduler
spec:
  containers:
    - name: app
      image: k8slab/web:v1
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "64"
          memory: 1Gi
